version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "main"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Kolkata"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"

    reviewers:
      - "faisalg1t"

    commit-message:
      prefix: "chore"
      include: "scope"

    rebase-strategy: "auto"

    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:30"
      timezone: "Asia/Kolkata"

    open-pull-requests-limit: 3

    labels:
      - "github-actions"

    reviewers:
      - "faisalg1t"

    commit-message:
      prefix: "ci"
      include: "scope"

    rebase-strategy: "auto"
